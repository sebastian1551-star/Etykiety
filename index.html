<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>GENERATOR ETYKIET ODPADÓW - FINAL EXPERT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        body { background-color: #e9ecef; font-family: "Century Gothic", sans-serif; padding-bottom: 50px; }
        .app-card { max-width: 1100px; margin: 30px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        
        /* Menu wyboru kodów */
        .quick-select-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 30px; }
        .quick-tile { 
            background: #fff; border: 2px solid #333; padding: 15px; border-radius: 12px; 
            text-align: center; cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column;
        }
        .quick-tile b { font-size: 1.3rem; color: #000; }
        .quick-tile.danger { border-color: #ce1126; color: #ce1126; }
        .quick-tile.active { background: #333 !important; color: #fff !important; }
        .quick-tile.danger.active { background: #ce1126 !important; color: #fff !important; }

        /* Sekcja formularza */
        #content-selection-area { display: none; border-top: 3px solid #f0f0f0; margin-top: 25px; padding-top: 25px; }
        .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .checkbox-item { 
            background: #f8f9fa; border: 1px solid #ddd; padding: 10px; border-radius: 10px; 
            cursor: pointer; font-weight: bold; text-align: center; font-size: 0.85rem;
        }
        .checkbox-item.checked { background: #000; color: #fff; }
        .checkbox-item.danger-checked { background: #ce1126; color: #fff; }

        #extra-fields { display: none; padding: 20px; border-radius: 15px; background: #fff5f5; border: 1px solid #ffdada; margin-top: 20px; }
        .zip-container { display: flex; align-items: center; gap: 4px; margin-bottom: 15px; }
        .zip-tile { width: 38px; height: 42px; text-align: center; font-weight: bold; border: 2px solid #ddd; border-radius: 6px; }

        /* --- RENDERER ETYKIETY (ZGODNY ZE ZDJĘCIEM) --- */
        #label-render {
            width: 1122px; height: 794px; position: absolute; left: -9999px; 
            background: white; border: 20px solid #ce1126; 
            display: flex; flex-direction: column; 
            padding: 30px 40px; box-sizing: border-box; color: black;
        }
        #label-render.normal-mode { border-color: black; }

        .label-header { text-align: left; margin-bottom: 10px; }
        #logo-preview-label { max-height: 50px; max-width: 250px; object-fit: contain; }

        .danger-banner { 
            color: #ce1126; font-size: 85px; font-weight: 900; text-align: center;
            border-bottom: 8px solid #ce1126; line-height: 1.1; margin-bottom: 20px;
        }

        .main-info { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        #res-code { font-size: 190px; font-weight: 900; line-height: 0.8; margin-top: -10px; letter-spacing: -5px; }
        #res-name { font-size: 48px; font-weight: bold; text-transform: uppercase; margin-bottom: 20px; }
        
        .content-line { 
            width: 100%; border-top: 8px solid #ce1126; padding-top: 20px; margin-top: 10px;
            display: flex; align-items: center; justify-content: center;
        }
        #res-content { font-size: 65px; font-weight: 900; text-transform: uppercase; line-height: 1; flex: 1; }
        
        .photo-holder { width: 380px; height: 260px; border: 1px solid #eee; margin-left: 20px; display: flex; align-items: center; justify-content: center; }
        #img-waste-label { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* ADRESY - STYL JAK NA ZDJĘCIU */
        .address-section { width: 100%; margin-top: auto; border: 6px solid #ce1126; display: flex; flex-direction: column; }
        .address-row { display: flex; align-items: center; padding: 10px 20px; border-bottom: 3px solid #ce1126; background: #fff; }
        .address-row:last-child { border-bottom: none; }
        .address-label { font-size: 28px; font-weight: 900; margin-right: 15px; white-space: nowrap; }
        .address-value { font-size: 32px; font-weight: 900; text-transform: uppercase; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        
        .date-mag { font-size: 20px; font-weight: bold; text-align: right; margin-top: 5px; color: #000; }

        .btn-gen { background: #28a745; color: white; padding: 20px; font-weight: 800; border-radius: 12px; width: 100%; border: none; font-size: 1.6rem; }
    </style>
</head>
<body>

<div class="app-card">
    <h3 class="text-center mb-4"><b>GENERATOR ETYKIET ENPROM</b></h3>
    
    <div class="quick-select-grid" id="quick-grid"></div>

    <div id="content-selection-area">
        <div class="row">
            <div class="col-md-6">
                <p class="font-weight-bold mb-2">ZAWARTOŚĆ:</p>
                <div id="dynamic-checkboxes" class="checkbox-grid"></div>
                <input type="text" id="contentInput" class="form-control form-control-lg mb-3" placeholder="Dodaj opis ręczny..." onkeyup="sync()">
                
                <div class="row">
                    <div class="col-6">
                        <button class="btn btn-outline-primary btn-block" onclick="document.getElementById('logo-input').click()">🖼️ LOGO</button>
                        <input type="file" id="logo-input" hidden onchange="previewLogo(event)">
                    </div>
                    <div class="col-6">
                        <button class="btn btn-outline-dark btn-block" id="btn-foto" onclick="document.getElementById('waste-input').click()">📸 FOTO</button>
                        <input type="file" id="waste-input" hidden onchange="previewWaste(event)">
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div id="extra-fields">
                    <p class="font-weight-bold mb-2">LOKALIZACJA I DATA:</p>
                    <div class="zip-container">
                        <input type="text" class="zip-tile" maxlength="1" id="z1">
                        <input type="text" class="zip-tile" maxlength="1" id="z2">
                        <span class="mx-1 font-weight-bold">-</span>
                        <input type="text" class="zip-tile" maxlength="1" id="z3">
                        <input type="text" class="zip-tile" maxlength="1" id="z4">
                        <input type="text" class="zip-tile" maxlength="1" id="z5">
                    </div>
                    <input type="text" id="cityInput" list="city-list" class="form-control mb-2" placeholder="Miejscowość..." oninput="sync()">
                    <datalist id="city-list">
                        <option value="Otwock"><option value="Warszawa"><option value="Gdańsk"><option value="Katowice">
                    </datalist>
                    <input type="text" id="streetInput" class="form-control mb-2" placeholder="Ulica / Nazwa budowy..." onkeyup="sync()">
                    <input type="date" id="dateInput" class="form-control" onchange="sync()">
                </div>
            </div>
        </div>

        <button type="button" id="btnGen" onclick="generatePDF()" class="btn-gen mt-4">POBIERZ ETYKIETĘ PDF (A4)</button>
    </div>
</div>

<div id="label-render">
    <div class="label-header"><img id="logo-preview-label" src=""></div>
    <div class="danger-banner" id="lbl-danger-txt">ODPAD NIEBEZPIECZNY</div>
    
    <div class="main-info">
        <div id="res-code">00 00 00</div>
        <div id="res-name">NAZWA ODPADU</div>
        <div class="content-line" id="lbl-line">
            <div id="res-content">---</div>
            <div class="photo-holder" id="lbl-photo-box"><img id="img-waste-label" src=""></div>
        </div>
    </div>
    
    <div class="address-section" id="lbl-address-sec">
        <div class="address-row">
            <span class="address-label">MIEJSCE:</span>
            <span id="lbl-place1" class="address-value">-</span>
        </div>
        <div class="address-row">
            <span class="address-label">ZMIANA MIEJSCA:</span>
            <span class="address-value">..........................................................</span>
        </div>
    </div>
    <div class="date-mag" id="lbl-date-row">DATA ROZPOCZĘCIA MAGAZYNOWANIA: <span id="lbl-date-val">-</span></div>
</div>

<script>
    const WASTES = [
        { code: "15 01 10*", name: "Opakowania niebezpieczne", items: ["FARBY", "LAKIERY", "SPRAYE", "CHEMIA", "OPAKOWANIA"] },
        { code: "15 02 02*", name: "Sorbenty i czyściwo", items: ["SZMATY", "CZYŚCIWO", "FILTRY OLEJU", "SORBENT", "MATY"] },
        { code: "16 02 13*", name: "Zużyta elektronika", items: ["KOMPUTERY", "KABLE", "BATERIE", "RTV"] },
        { code: "17 04 05", name: "Żelazo i stal", items: ["ZŁOM", "RURY", "PROFILE"] },
        { code: "17 02 01", name: "Drewno", items: ["PALETY", "DESKI", "SKRZYNIE"] },
        { code: "15 01 02", name: "Plastik / Folia", items: ["FOLIA", "STRAPING", "BAŃKI"] }
    ];

    const ZIP_DB = { "05400": "Otwock", "00001": "Warszawa" };
    let currentWaste = null;

    window.onload = () => {
        const grid = document.getElementById('quick-grid');
        WASTES.forEach(w => {
            const div = document.createElement('div');
            const isD = w.code.includes('*');
            div.className = `quick-tile ${isD ? 'danger' : ''}`;
            div.innerHTML = `<b>${w.code}</b><small>${w.name}</small>`;
            div.onclick = () => selectWaste(w, div);
            grid.appendChild(div);
        });
        const savedLogo = localStorage.getItem('global_logo');
        if (savedLogo) document.getElementById('logo-preview-label').src = savedLogo;
    };

    function selectWaste(waste, el) {
        currentWaste = waste;
        document.querySelectorAll('.quick-tile').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('content-selection-area').style.display = 'block';
        
        const isD = waste.code.includes('*');
        const render = document.getElementById('label-render');
        
        // Przełączanie trybu Danger/Zwykły
        if(isD) {
            render.classList.remove('normal-mode');
            document.getElementById('lbl-danger-txt').style.display = "block";
            document.getElementById('lbl-address-sec').style.display = "flex";
            document.getElementById('lbl-date-row').style.display = "block";
            document.getElementById('extra-fields').style.display = "block";
            document.getElementById('lbl-photo-box').style.display = "none";
            document.getElementById('btn-foto').disabled = true;
        } else {
            render.classList.add('normal-mode');
            document.getElementById('lbl-danger-txt').style.display = "none";
            document.getElementById('lbl-address-sec').style.display = "none";
            document.getElementById('lbl-date-row').style.display = "none";
            document.getElementById('extra-fields').style.display = "none";
            document.getElementById('lbl-photo-box').style.display = "flex";
            document.getElementById('btn-foto').disabled = false;
        }

        document.getElementById('res-code').innerText = waste.code;
        document.getElementById('res-name').innerText = waste.name;
        document.getElementById('dynamic-checkboxes').innerHTML = waste.items.map(i => 
            `<div class="checkbox-item" onclick="toggleOption(this, ${isD})">${i}</div>`).join('');
        
        sync();
    }

    function toggleOption(el, isD) {
        el.classList.toggle(isD ? 'danger-checked' : 'checked');
        sync();
    }

    function previewLogo(e) {
        const r = new FileReader();
        r.onload = ev => { document.getElementById('logo-preview-label').src = ev.target.result; localStorage.setItem('global_logo', ev.target.result); };
        r.readAsDataURL(e.target.files[0]);
    }

    function previewWaste(e) {
        const r = new FileReader();
        r.onload = ev => { document.getElementById('img-waste-label').src = ev.target.result; };
        r.readAsDataURL(e.target.files[0]);
    }

    function sync() {
        if (!currentWaste) return;
        const isD = currentWaste.code.includes('*');
        
        const sel = Array.from(document.querySelectorAll(isD ? '.danger-checked' : '.checked')).map(i => i.innerText);
        const man = document.getElementById('contentInput').value.toUpperCase();
        let f = sel.join(' / ');
        if (man) f += (f ? ' / ' : '') + man;
        document.getElementById('res-content').innerText = f || "---";

        // Adres
        const zip = [1,2,3,4,5].map(i => document.getElementById('z'+i).value).join('');
        if(zip.length === 5 && ZIP_DB[zip] && !document.getElementById('cityInput').value) {
            document.getElementById('cityInput').value = ZIP_DB[zip];
        }
        const city = document.getElementById('cityInput').value;
        const street = document.getElementById('streetInput').value;
        const zipF = zip.length === 5 ? zip.substring(0,2)+'-'+zip.substring(2) : zip;
        
        let addrArr = [];
        if(zipF) addrArr.push(zipF);
        if(city) addrArr.push(city);
        if(street) addrArr.push(street);
        
        document.getElementById('lbl-place1').innerText = addrArr.join(', ') || "-";
        document.getElementById('lbl-date-val').innerText = document.getElementById('dateInput').value || "-";
    }

    document.querySelectorAll('.zip-tile').forEach((t, i, arr) => {
        t.oninput = () => { if(t.value && i < 4) arr[i+1].focus(); sync(); };
        t.onkeydown = (e) => { if(e.key === "Backspace" && !t.value && i > 0) arr[i-1].focus(); };
    });

    async function generatePDF() {
        const btn = document.getElementById('btnGen');
        btn.innerText = "GENEROWANIE...";
        const canvas = await html2canvas(document.getElementById('label-render'), { scale: 2 });
        const pdf = new jspdf.jsPDF({ orientation: 'l', unit: 'mm', format: 'a4' });
        pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 297, 210);
        pdf.save(`Etykieta_${currentWaste.code.replace('*','')}.pdf`);
        btn.innerText = "POBIERZ ETYKIETĘ PDF (A4)";
    }
</script>
</body>
</html>
