<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>KATALOG ODPADÓW ENPROM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        body { background-color: #f0f2f5; font-family: "Century Gothic", AppleGothic, sans-serif; }
        .app-card { max-width: 850px; margin: 30px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        /* INTERFEJS - CZERWONE TŁO DLA NIEBEZPIECZNYCH */
        #extra-fields { 
            display: none; margin-top: 20px; padding: 25px; border-radius: 15px; 
            background: #f8f9fa; border: 1px solid #dee2e6; transition: background 0.3s ease;
        }
        #extra-fields.danger-ui { background: #fff5f5; border-color: #feb2b2; }

        .zip-container { display: flex; align-items: center; gap: 8px; }
        .zip-tile { width: 42px; height: 50px; text-align: center; font-size: 22px; font-weight: bold; border: 2px solid #dee2e6; border-radius: 8px; }

        /* --- STYLIZACJA ETYKIETY (A4 Poziomo) --- */
        #label-render {
            width: 1122px; height: 794px;
            position: absolute; left: -9999px; 
            background: white; border: 25px solid black; 
            display: flex; flex-direction: column; 
            padding: 30px; box-sizing: border-box; color: black;
            justify-content: center; align-items: center;
        }
        #label-render.danger-mode { border-color: #ce1126 !important; justify-content: space-between; }
        
        #danger-header { 
            display: none; font-size: 55px; font-weight: 900; color: #ce1126; 
            margin-bottom: 10px; text-transform: uppercase; border-bottom: 10px solid #ce1126; width: 100%; text-align: center;
        }
        #label-render.danger-mode #danger-header { display: block; }

        .content-box { text-align: center; width: 100%; }
        #res-hint { font-size: 26px; font-weight: bold; color: #ce1126; text-transform: uppercase; margin-bottom: 5px; height: 32px; }
        #res-code { font-size: 190px; font-weight: bold; line-height: 0.8; margin: 10px 0; }
        #res-name { font-size: 30px; text-transform: uppercase; margin-bottom: 15px; width: 90%; margin-left: auto; margin-right: auto; font-weight: 600; min-height: 75px; }
        .divider { width: 90%; height: 6px; background: black; margin: 15px auto; }
        #label-render.danger-mode .divider { background: #ce1126; }
        #res-content { font-size: 48px; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; }
        
        /* STOPKA - SZTYWNY UKŁAD */
        .info-footer { display: none; width: 100%; border-top: 4px solid #000; padding-top: 15px; }
        #label-render.danger-mode .info-footer { display: block; }
        
        .footer-table { width: 100%; border-collapse: collapse; }
        .footer-table td { width: 50%; vertical-align: top; padding: 5px; }
        .data-row { border: 1px solid #000; padding: 8px; margin-bottom: 5px; display: flex; align-items: center; font-size: 19px; min-height: 40px; }
        .dots-fill { border-bottom: 2px dotted #000; flex-grow: 1; margin-left: 10px; height: 16px; }

        .btn-main { background: #000; color: white; padding: 18px; font-weight: bold; border-radius: 12px; width: 100%; border: none; font-size: 1.3rem; cursor: pointer; }
        .results-list { position: absolute; z-index: 1000; width: 100%; max-height: 250px; overflow-y: auto; background: white; border: 1px solid #ccc; }
    </style>
</head>
<body>

<div class="app-card">
    <h3 class="text-center mb-4"><b>GENERATOR ETYKIET ENPROM</b></h3>

    <div class="form-group position-relative">
        <label><b>1. SZUKAJ KODU ODPADU</b></label>
        <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="Wpisz kod (np. 150110)..." onkeyup="filterWaste()">
        <div id="results" class="results-list"></div>
    </div>

    <div class="form-group">
        <label><b>2. ZAWARTOŚĆ</b></label>
        <input type="text" id="contentInput" class="form-control" placeholder="Opis zawartości..." onkeyup="sync()">
    </div>

    <div id="extra-fields">
        <div class="row">
            <div class="col-md-7 form-group">
                <label>ADRES ROZPOCZĘCIA SKŁADOWANIA</label>
                <input type="text" id="placeInput" class="form-control" placeholder="Ulica, numer, miejscowość" onkeyup="sync()">
            </div>
            <div class="col-md-5 form-group">
                <label>KOD POCZTOWY</label>
                <div class="zip-container">
                    <input type="text" class="zip-tile" maxlength="1" oninput="zipMove(this, 'zip2')" id="zip1">
                    <input type="text" class="zip-tile" maxlength="1" oninput="zipMove(this, 'zip3')" id="zip2">
                    <span style="font-size: 20px; font-weight: bold;">-</span>
                    <input type="text" class="zip-tile" maxlength="1" oninput="zipMove(this, 'zip4')" id="zip3">
                    <input type="text" class="zip-tile" maxlength="1" oninput="zipMove(this, 'zip5')" id="zip4">
                    <input type="text" class="zip-tile" maxlength="1" oninput="sync()" id="zip5">
                </div>
            </div>
            <div class="col-md-12 form-group">
                <label>DATA ROZPOCZĘCIA SKŁADOWANIA</label>
                <input type="date" id="dateInput" class="form-control" onchange="sync()">
            </div>
        </div>
    </div>

    <input type="hidden" id="selCode">
    <button type="button" id="btnGen" onclick="generatePDF()" class="btn-main mt-4">PDF (pobierz)</button>
</div>

<div id="label-render">
    <div id="danger-header">ODPADY NIEBEZPIECZNE</div>
    
    <div class="content-box">
        <div id="res-hint"></div>
        <div id="res-code">00 00 00</div>
        <div id="res-name">WYBIERZ KOD ODPADU</div>
        <div class="divider"></div>
        <div id="res-content"></div>
    </div>
    
    <div class="info-footer">
        <table class="footer-table">
            <tr>
                <td>
                    <div style="font-weight:bold; margin-bottom:5px;">ADRESY SKŁADOWANIA:</div>
                    <div class="data-row">I: <span id="lbl-place-full" style="margin-left:8px; font-weight:bold;">-</span></div>
                    <div class="data-row">II: <span class="dots-fill"></span></div>
                    <div class="data-row">III: <span class="dots-fill"></span></div>
                </td>
                <td>
                    <div style="font-weight:bold; margin-bottom:5px;">DATY PRZEJĘCIA:</div>
                    <div class="data-row">START: <span id="lbl-date" style="margin-left:8px; font-weight:bold;">-</span></div>
                    <div class="data-row">II: <span class="dots-fill" style="max-width:140px;"></span></div>
                    <div class="data-row">III: <span class="dots-fill" style="max-width:140px;"></span></div>
                </td>
            </tr>
        </table>
    </div>
</div>

<script>
    const WASTES = [
        {code: "15 01 10*", name: "Opakowania zawierające pozostałości substancji niebezpiecznych lub nimi zanieczyszczone", hint: "FARBY, LAKIERY, SPRAYE, OPAKOWANIA PO CHEMII"},
        {code: "15 01 01", name: "Opakowania z papieru i tektury", hint: "KARTONY, PAPIER, WORKI PAPIEROWE"},
        {code: "15 01 02", name: "Opakowania z tworzyw sztucznych", hint: "FOLIE, BUTELKI, BAŃKI PLASTIKOWE (CZYSTE)"},
        {code: "16 02 13*", name: "Zużyte urządzenia zawierające niebezpieczne elementy", hint: "ELEKTRONIKA, ZUŻYTE URZĄDZENIA ELEKTRYCZNE"},
        {code: "17 01 01", name: "Odpady betonu oraz gruz betonowy", hint: "BETON, GRUZ Z REMONTÓW"},
        {code: "17 04 05", name: "Żelazo i stal", hint: "KONSTRUKCJE STALOWE, ZŁOM ŻELAZNY"},
        {code: "20 03 01", name: "Niesegregowane (zmieszane) odpady komunalne", hint: "ODPADY BYTOWE, ŚMIECI ZMIESZANE"}
    ];

    function zipMove(current, nextId) {
        current.value = current.value.replace(/[^0-9]/g, '');
        if (current.value.length === 1 && nextId) document.getElementById(nextId).focus();
        sync();
    }

    function filterWaste() {
        const input = document.getElementById('searchInput').value.toLowerCase().replace(/\s+/g, '');
        const resDiv = document.getElementById('results');
        if (input.length < 1) { resDiv.innerHTML = ''; return; }
        const matches = WASTES.filter(i => i.code.replace(/\s+/g, '').toLowerCase().includes(input) || i.name.toLowerCase().includes(input));
        let html = '<div class="list-group shadow">';
        matches.forEach(item => {
            html += `<button type="button" class="list-group-item list-group-item-action" onclick="selectItem('${item.code}', '${item.name}', '${item.hint}')">
                        <b>${item.code}</b> - ${item.name} <br><small class="text-danger">Wskazówka: ${item.hint}</small>
                     </button>`;
        });
        resDiv.innerHTML = html + '</div>';
    }

    function selectItem(code, name, hint) {
        document.getElementById('selCode').value = code;
        document.getElementById('searchInput').value = code;
        document.getElementById('results').innerHTML = '';
        const isDanger = code.includes('*');
        const label = document.getElementById('label-render');
        const uiPanel = document.getElementById('extra-fields');

        if (isDanger) { 
            label.classList.add('danger-mode'); 
            uiPanel.style.display = 'block';
            uiPanel.classList.add('danger-ui'); // Dodaje czerwone tło w UI
        } else { 
            label.classList.remove('danger-mode'); 
            uiPanel.style.display = 'none';
            uiPanel.classList.remove('danger-ui');
        }
        document.getElementById('res-code').innerText = code;
        document.getElementById('res-name').innerText = name;
        document.getElementById('res-hint').innerText = hint;
        sync();
    }

    function sync() {
        document.getElementById('res-content').innerText = document.getElementById('contentInput').value.toUpperCase();
        const place = document.getElementById('placeInput').value;
        const zip = document.getElementById('zip1').value + document.getElementById('zip2').value + "-" + document.getElementById('zip3').value + document.getElementById('zip4').value + document.getElementById('zip5').value;
        document.getElementById('lbl-place-full').innerText = (place || "_______________") + (zip.length > 1 ? ", " + zip : "");
        document.getElementById('lbl-date').innerText = document.getElementById('dateInput').value || "__________";
    }

    async function generatePDF() {
        if (!document.getElementById('selCode').value) return alert("Wybierz kod!");
        const hintEl = document.getElementById('res-hint');
        hintEl.style.visibility = 'hidden'; 
        try {
            const canvas = await html2canvas(document.getElementById('label-render'), { scale: 2 });
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ orientation: 'l', unit: 'mm', format: 'a4' });
            pdf.addImage(imgData, 'PNG', 0, 0, 297, 210);
            pdf.save(`Etykieta_${document.getElementById('selCode').value.replace('*','')}.pdf`);
        } catch (e) { alert("Błąd!"); }
        hintEl.style.visibility = 'visible'; 
    }
</script>
</body>
</html>
