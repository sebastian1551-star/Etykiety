<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>GENERATOR ETYKIET ENPROM - PRO EXPERT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        body { background-color: #e9ecef; font-family: "Century Gothic", "Segoe UI", sans-serif; padding-bottom: 50px; }
        .app-card { max-width: 1100px; margin: 30px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        
        .quick-select-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 30px; }
        .quick-tile { 
            background: #fff; border: 2px solid #333; padding: 15px; border-radius: 12px; 
            text-align: center; cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; justify-content: center;
        }
        .quick-tile:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .quick-tile b { font-size: 1.3rem; color: #000; display: block; }
        .quick-tile small { color: #555; line-height: 1.2; margin-top: 5px; }
        .quick-tile.danger { border-color: #ce1126; color: #ce1126; }
        .quick-tile.active { background: #333 !important; color: #fff !important; border-color: #000; }
        .quick-tile.danger.active { background: #ce1126 !important; border-color: #ce1126 !important; color: #fff !important; }

        #content-selection-area { display: none; border-top: 3px solid #f0f0f0; margin-top: 25px; padding-top: 25px; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .section-title { font-size: 0.9rem; font-weight: 800; text-transform: uppercase; color: #444; margin-bottom: 15px; display: flex; align-items: center; }
        .section-title span { background: #000; color: #fff; padding: 2px 8px; border-radius: 4px; margin-right: 10px; }

        .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .checkbox-item { 
            background: #f8f9fa; border: 1px solid #ddd; padding: 10px; border-radius: 10px; 
            cursor: pointer; font-weight: bold; text-align: center; transition: 0.2s; font-size: 0.85rem;
        }
        .checkbox-item:hover { background: #e2e6ea; }
        .checkbox-item.checked { background: #000; color: #fff; border-color: #000; }
        .checkbox-item.danger-checked { background: #ce1126; color: #fff; border-color: #ce1126; }

        .upload-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .photo-box { background: #fff; border: 2px dashed #ccc; padding: 15px; border-radius: 12px; text-align: center; }
        
        #extra-fields { display: none; padding: 20px; border-radius: 15px; background: #fff5f5; border: 1px solid #ffdada; margin-top: 20px; }
        .zip-container { display: flex; align-items: center; gap: 4px; }
        .zip-tile { width: 38px; height: 42px; text-align: center; font-weight: bold; border: 2px solid #ddd; border-radius: 6px; font-size: 1.2rem; }
        .zip-tile:focus { border-color: #ce1126; outline: none; }

        /* RENDERER PDF */
        #label-render {
            width: 1122px; height: 794px; position: absolute; left: -9999px; 
            background: white; border: 20px solid #ce1126; 
            display: flex; flex-direction: column; 
            padding: 30px 50px; box-sizing: border-box; color: black; overflow: hidden;
        }
        
        .header-row { width: 100%; height: 50px; display: flex; align-items: center; margin-bottom: 5px; }
        #logo-preview-label { max-height: 50px; max-width: 300px; object-fit: contain; }
        
        #danger-header { 
            font-size: 60px; font-weight: 900; color: #ce1126; 
            border-bottom: 8px solid #ce1126; width: 100%; text-align: center; 
            margin: 0 0 15px 0; padding-bottom: 5px; line-height: 1;
        }

        .main-content { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        #res-code { font-size: 210px; font-weight: 900; line-height: 0.75; margin: 0; letter-spacing: -5px; }
        #res-name { font-size: 40px; text-transform: uppercase; font-weight: 900; margin-bottom: 20px; }
        
        .photo-and-desc { display: flex; flex-direction: column; align-items: center; width: 100%; border-top: 6px solid #ce1126; padding-top: 15px; }
        
        #res-content { font-size: 70px; font-weight: 900; text-transform: uppercase; line-height: 1; margin-bottom: 15px; }
        
        /* SEKCJA ADRESU - POPRAWIONA WYSOKOŚĆ */
        .footer-info { width: 100%; margin-top: auto; }
        .address-box { 
            border: 4px solid #ce1126; 
            padding: 8px 15px; 
            font-size: 20px; 
            font-weight: 900; 
            margin-bottom: 8px; 
            background: #fff; 
            text-align: left;
            text-transform: uppercase;
        }
        .address-box.dotted { 
            border: 4px dashed #ce1126; 
            min-height: 55px; 
        }
        .date-box { font-size: 18px; font-weight: 900; text-align: right; text-transform: uppercase; }

        .btn-gen { background: #28a745; color: white; padding: 18px; font-weight: 800; border-radius: 12px; width: 100%; border: none; font-size: 1.5rem; transition: 0.3s; cursor: pointer; }
        .btn-gen:hover { background: #218838; transform: scale(1.02); }
    </style>
</head>
<body>

<div class="app-card">
    <div class="text-center mb-4">
        <h2 style="font-weight: 900; letter-spacing: -1px;">GENERATOR ETYKIET ODPADÓW</h2>
        <span class="badge badge-dark">System Zgodny z BDO / ENPROM 2026</span>
    </div>

    <div class="section-title"><span>1</span> WYBIERZ RODZAJ ODPADU</div>
    <div class="quick-select-grid" id="quick-grid"></div>

    <div id="content-selection-area">
        <div class="row">
            <div class="col-md-6">
                <div class="section-title"><span>2</span> USZCZEGÓŁOWIENIE ZAWARTOŚCI</div>
                <div id="dynamic-checkboxes" class="checkbox-grid"></div>
                <input type="text" id="contentInput" class="form-control form-control-lg" placeholder="Wpisz własny opis..." onkeyup="sync()">
                
                <div class="mt-4">
                    <div class="section-title"><span>3</span> LOGO FIRMY</div>
                    <div class="photo-box">
                        <input type="file" accept="image/*" id="logo-input" onchange="previewLogo(event)" style="display: none;">
                        <button class="btn btn-outline-primary btn-sm btn-block" onclick="document.getElementById('logo-input').click()">🖼️ ZAŁADUJ LOGO</button>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div id="extra-fields" style="display: block;">
                    <div class="section-title"><span>4</span> DANE LOKALIZACYJNE</div>
                    
                    <label class="small mb-1">MIEJSCOWOŚĆ:</label>
                    <input type="text" id="cityInput" list="city-list" class="form-control mb-3" placeholder="Np. Lutkówka Druga..." oninput="handleCityChange()">
                    <datalist id="city-list"></datalist>

                    <label class="small mb-1">KOD POCZTOWY:</label>
                    <div class="zip-container mb-3">
                        <input type="text" class="zip-tile" maxlength="1" id="z1">
                        <input type="text" class="zip-tile" maxlength="1" id="z2">
                        <span>-</span>
                        <input type="text" class="zip-tile" maxlength="1" id="z3">
                        <input type="text" class="zip-tile" maxlength="1" id="z4">
                        <input type="text" class="zip-tile" maxlength="1" id="z5">
                    </div>

                    <label class="small mb-1">ADRES:</label>
                    <input type="text" id="streetInput" class="form-control mb-3" placeholder="Np. Grójecka 24" onkeyup="sync()">

                    <label class="small mb-1">DATA ROZPOCZĘCIA:</label>
                    <input type="date" id="dateInput" class="form-control" onchange="sync()">
                </div>
            </div>
        </div>

        <button type="button" id="btnGen" onclick="generatePDF()" class="btn-gen mt-5">POBIERZ ETYKIETĘ (A4 PDF)</button>
    </div>
</div>

<div id="label-render">
    <div class="header-row"><img id="logo-preview-label" src=""></div>
    <div id="danger-header">ODPAD NIEBEZPIECZNY</div>
    
    <div class="main-content">
        <div id="res-code">00 00 00</div>
        <div id="res-name">NAZWA ODPADU</div>
        <div class="photo-and-desc">
            <div id="res-content">---</div>
        </div>
    </div>
    
    <div class="footer-info">
        <div class="address-box">MIEJSCE: <span id="lbl-place">-</span></div>
        <div class="address-box dotted">ZMIANA MIEJSCA:</div>
        <div class="date-box">DATA ROZPOCZĘCIA MAGAZYNOWANIA: <span id="lbl-date">-</span></div>
    </div>
</div>

<script>
    const LOCATIONS = [
        { city: "Lutkówka Druga", zip: "96323", street: "Grójecka 24" },
        { city: "Otwock", zip: "05400", street: "ul. Przemysłowa 1" }
    ];

    const WASTES = [
        { code: "15 01 10*", name: "Opakowania niebezpieczne", items: ["FARBY", "LAKIERY", "SPRAYE", "SMARY"] },
        { code: "15 02 02*", name: "Sorbenty i czyściwo", items: ["SZMATY OLEJOWE", "FILTRY", "SORBENT"] }
    ];

    let currentWaste = null;

    window.onload = () => {
        const grid = document.getElementById('quick-grid');
        WASTES.forEach(w => {
            const div = document.createElement('div');
            div.className = `quick-tile danger`;
            div.innerHTML = `<b>${w.code}</b><small>${w.name}</small>`;
            div.onclick = () => selectWaste(w, div);
            grid.appendChild(div);
        });

        const dl = document.getElementById('city-list');
        LOCATIONS.forEach(l => {
            const opt = document.createElement('option');
            opt.value = l.city;
            dl.appendChild(opt);
        });

        const savedLogo = localStorage.getItem('global_logo');
        if (savedLogo) document.getElementById('logo-preview-label').src = savedLogo;
    };

    function selectWaste(waste, el) {
        currentWaste = waste;
        document.querySelectorAll('.quick-tile').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('content-selection-area').style.display = 'block';
        document.getElementById('res-code').innerText = waste.code;
        document.getElementById('res-name').innerText = waste.name.toUpperCase();
        document.getElementById('dynamic-checkboxes').innerHTML = waste.items.map(i => 
            `<div class="checkbox-item" onclick="toggleOption(this)">${i}</div>`
        ).join('');
        sync();
    }

    function handleCityChange() {
        const city = document.getElementById('cityInput').value;
        const found = LOCATIONS.find(l => l.city.toLowerCase() === city.toLowerCase());
        if (found) {
            found.zip.split('').forEach((d, i) => document.getElementById('z' + (i + 1)).value = d);
            document.getElementById('streetInput').value = found.street;
        }
        sync();
    }

    function toggleOption(el) {
        el.classList.toggle('danger-checked');
        sync();
    }

    function previewLogo(event) {
        const reader = new FileReader();
        reader.onload = e => { 
            document.getElementById('logo-preview-label').src = e.target.result; 
            localStorage.setItem('global_logo', e.target.result);
        };
        reader.readAsDataURL(event.target.files[0]);
    }

    function sync() {
        if (!currentWaste) return;
        const sel = Array.from(document.querySelectorAll('.danger-checked')).map(i => i.innerText);
        const man = document.getElementById('contentInput').value.toUpperCase();
        let finalContent = sel.join(' / ');
        if (man) finalContent += (finalContent ? ' / ' : '') + man;
        document.getElementById('res-content').innerText = finalContent || "---";

        const zip = [1,2,3,4,5].map(i => document.getElementById('z'+i).value).join('');
        const fZip = zip.length >= 2 ? zip.substring(0,2)+'-'+zip.substring(2) : zip;
        const city = document.getElementById('cityInput').value;
        const street = document.getElementById('streetInput').value;
        
        let addr = [];
        if(fZip) addr.push(fZip);
        if(city) addr.push(city);
        if(street) addr.push(street);
        
        document.getElementById('lbl-place').innerText = addr.join(', ') || "-";
        document.getElementById('lbl-date').innerText = document.getElementById('dateInput').value || "-";
    }

    document.querySelectorAll('.zip-tile').forEach((t, i, arr) => {
        t.oninput = () => { if(t.value && i < 4) arr[i+1].focus(); sync(); };
        t.onkeydown = (e) => { if(e.key === "Backspace" && !t.value && i > 0) arr[i-1].focus(); };
    });

    async function generatePDF() {
        const btn = document.getElementById('btnGen');
        btn.innerText = "⏳ CZEKAJ...";
        try {
            const canvas = await html2canvas(document.getElementById('label-render'), { scale: 2 });
            const pdf = new jspdf.jsPDF({ orientation: 'l', unit: 'mm', format: 'a4' });
            pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 297, 210);
            pdf.save(`Etykieta_${currentWaste.code.replace(/\*/g,'')}.pdf`);
        } catch (err) { alert("Błąd!"); }
        btn.innerText = "POBIERZ ETYKIETĘ (A4 PDF)";
    }
</script>
</body>
</html>
