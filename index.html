<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>GENERATOR ETYKIET ENPROM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        body { background-color: #f0f2f5; font-family: "Century Gothic", sans-serif; padding-bottom: 50px; }
        .app-card { max-width: 1000px; margin: 20px auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        
        /* GRID WYBORU */
        .quick-select-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-bottom: 25px; }
        .quick-tile { 
            background: #fff; border: 2px solid #000; padding: 12px; border-radius: 10px; 
            text-align: center; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column;
        }
        .quick-tile:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .quick-tile b { font-size: 1.2rem; display: block; color: #000; }
        .quick-tile span { font-size: 0.9rem; font-weight: 900; text-transform: uppercase; color: #333; margin: 2px 0; }
        .quick-tile small { font-size: 0.75rem; color: #666; border-top: 1px solid #eee; padding-top: 5px; }
        
        .quick-tile.danger { border-color: #ce1126; }
        .quick-tile.danger span { color: #ce1126; }
        .quick-tile.active { background: #000 !important; color: #fff !important; }
        .quick-tile.active span, .quick-tile.active small { color: #fff !important; }
        .quick-tile.danger.active { background: #ce1126 !important; border-color: #ce1126 !important; }

        /* PANEL KONTROLNY */
        #content-selection-area { display: none; border-top: 2px solid #eee; margin-top: 20px; padding-top: 20px; }
        .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 15px; }
        .checkbox-item { background: #f8f9fa; border: 1px solid #dee2e6; padding: 8px; border-radius: 8px; cursor: pointer; font-weight: bold; text-align: center; font-size: 0.85rem; }
        .checkbox-item.checked { background: #000; color: #fff; border-color: #000; }
        .checkbox-item.danger-checked { background: #ce1126; color: #fff; border-color: #ce1126; }

        .upload-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .photo-box { background: #f8f9fa; border: 1px dashed #adb5bd; padding: 10px; border-radius: 8px; text-align: center; }

        #extra-fields { display: none; padding: 15px; border-radius: 12px; background: #fff5f5; border: 1px solid #feb2b2; margin-top: 15px; }
        .zip-container { display: flex; align-items: center; gap: 3px; }
        .zip-tile { width: 30px; height: 35px; text-align: center; font-size: 16px; font-weight: bold; border: 1px solid #ccc; border-radius: 4px; }

        /* --- RENDERER PDF (A4 POZIOMO) --- */
        #label-render {
            width: 1122px; height: 794px; position: absolute; left: -9999px; 
            background: white; border: 20px solid black; display: flex; flex-direction: column; 
            padding: 30px; box-sizing: border-box; color: black;
        }
        #label-render.danger-mode { border-color: #ce1126 !important; }
        
        .header-row { display: flex; justify-content: space-between; align-items: center; width: 100%; height: 100px; margin-bottom: 10px; }
        #logo-preview-label { max-height: 90px; max-width: 300px; object-fit: contain; display: none; }
        
        #danger-header { 
            display: none; font-size: 50px; font-weight: 900; color: #ce1126; 
            border-bottom: 8px solid #ce1126; width: 100%; text-align: center; margin-bottom: 15px;
        }
        #label-render.danger-mode #danger-header { display: block; }

        .main-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        #res-code { font-size: 140px; font-weight: 900; line-height: 0.8; margin: 0; letter-spacing: -2px; }
        #res-name { font-size: 30px; text-transform: uppercase; font-weight: bold; margin-bottom: 15px; }
        
        .photo-and-desc { display: flex; align-items: center; justify-content: center; gap: 25px; width: 100%; border-top: 5px solid #000; padding-top: 15px; }
        #label-render.danger-mode .photo-and-desc { border-top-color: #ce1126; }
        
        #res-content { font-size: 45px; font-weight: 900; text-transform: uppercase; line-height: 1.0; flex: 1; text-align: left; }
        #img-waste-label { max-width: 380px; max-height: 280px; border: 4px solid #eee; object-fit: cover; display: none; }

        /* KOMPAKTOWA STOPKA */
        .footer-info { width: 100%; margin-top: 15px; display: none; border-top: 2px solid #ce1126; padding-top: 10px; }
        .footer-info table { width: 100%; font-size: 16px; font-weight: bold; }
        .footer-info td { padding: 5px 10px; }

        .btn-gen { background: #28a745; color: white; padding: 15px; font-weight: bold; border-radius: 10px; width: 100%; border: none; font-size: 1.3rem; }
    </style>
</head>
<body>

<div class="app-card">
    <h3 class="text-center mb-4"><b>GENERATOR ETYKIET</b></h3>
    
    <div class="quick-select-grid" id="quick-grid"></div>

    <div id="content-selection-area">
        <div class="row">
            <div class="col-md-6">
                <p class="small mb-1"><b>1. ZAWARTOŚĆ:</b></p>
                <div id="dynamic-checkboxes" class="checkbox-grid"></div>
                <input type="text" id="contentInput" class="form-control form-control-sm mb-3" placeholder="Inny opis..." onkeyup="sync()">
            </div>
            <div class="col-md-6">
                <p class="small mb-1"><b>2. ZDJĘCIA:</b></p>
                <div class="upload-row">
                    <div class="photo-box">
                        <input type="file" accept="image/*" id="logo-input" onchange="previewLogo(event)" style="display: none;">
                        <button class="btn btn-outline-primary btn-sm btn-block" onclick="document.getElementById('logo-input').click()">🖼️ LOGO FIRMY</button>
                        <div id="logo-name" class="small mt-1" style="font-size: 10px;">Brak logo</div>
                    </div>
                    <div class="photo-box">
                        <input type="file" accept="image/*" id="waste-input" onchange="previewWaste(event)" style="display: none;">
                        <button class="btn btn-outline-dark btn-sm btn-block" onclick="document.getElementById('waste-input').click()">📸 FOTO ODPADU</button>
                        <div id="waste-name" class="small mt-1" style="font-size: 10px;">Brak zdjęcia</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="extra-fields">
            <div class="row">
                <div class="col-md-5">
                    <label class="small mb-0">MIEJSCE SKŁADOWANIA:</label>
                    <input type="text" id="placeInput" class="form-control form-control-sm" placeholder="Lokalizacja" onkeyup="sync()">
                </div>
                <div class="col-md-4">
                    <label class="small mb-0">KOD POCZTOWY:</label>
                    <div class="zip-container">
                        <input type="text" class="zip-tile" maxlength="1" id="z1">
                        <input type="text" class="zip-tile" maxlength="1" id="z2">
                        <span>-</span>
                        <input type="text" class="zip-tile" maxlength="1" id="z3">
                        <input type="text" class="zip-tile" maxlength="1" id="z4">
                        <input type="text" class="zip-tile" maxlength="1" id="z5">
                    </div>
                </div>
                <div class="col-md-3">
                    <label class="small mb-0">DATA:</label>
                    <input type="date" id="dateInput" class="form-control form-control-sm" onchange="sync()">
                </div>
            </div>
        </div>

        <button type="button" id="btnGen" onclick="generatePDF()" class="btn-gen mt-4">POBIERZ ETYKIETĘ (A4 PDF)</button>
    </div>
</div>

<div id="label-render">
    <div class="header-row">
        <img id="logo-preview-label" src="">
        <div style="font-size: 18px; font-weight: bold; text-align: right;">KARTA OZNACZENIA ODPADU</div>
    </div>
    
    <div id="danger-header">ODPAD NIEBEZPIECZNY</div>
    
    <div class="main-content">
        <div id="res-code">00 00 00</div>
        <div id="res-name">NAZWA ODPADU</div>
        
        <div class="photo-and-desc">
            <div id="res-content">---</div>
            <img id="img-waste-label" src="">
        </div>
    </div>
    
    <div class="footer-info" id="label-footer">
        <table border="0">
            <tr>
                <td style="width: 70%">LOKALIZACJA: <span id="lbl-place">-</span></td>
                <td style="width: 30%; text-align: right;">DATA: <span id="lbl-date">-</span></td>
            </tr>
        </table>
    </div>
</div>

<script>
    const WASTES = [
        { code: "15 01 10*", name: "Opakowania niebezpieczne", desc: "FARBY, LAKIERY, CHEMIA", items: ["FARBY", "LAKIERY", "SPRAYE", "CHEMIA"] },
        { code: "15 02 02*", name: "Sorbenty i czyściwo", desc: "SZMATY OLEJOWE, FILTRY", items: ["SZMATY", "CZYŚCIWO", "FILTRY", "SORBENT"] },
        { code: "16 02 13*", name: "Zużyta elektronika", desc: "RTV/AGD, KABLE", items: ["KOMPUTERY", "BATERIE", "KABLE"] },
        { code: "15 01 01", name: "Papier i Tektura", desc: "KARTONY I WORKI", items: ["KARTONY", "PAPIER", "TEKTURA"] },
        { code: "15 01 02", name: "Plastik / Folia", desc: "FOLIA I OPAKOWANIA", items: ["FOLIA", "STRAPING", "BAŃKI"] },
        { code: "17 04 05", name: "Żelazo i stal", desc: "ZŁOM I KONSTRUKCJE", items: ["ZŁOM", "RURY", "PROFILE"] },
        { code: "17 02 01", name: "Drewno", desc: "PALETY, DESKI", items: ["PALETY", "DESKI"] }
    ];

    let currentWaste = null;
    const grid = document.getElementById('quick-grid');

    WASTES.forEach(w => {
        const isDanger = w.code.includes('*');
        const div = document.createElement('div');
        div.className = `quick-tile ${isDanger ? 'danger' : ''}`;
        div.innerHTML = `<b>${w.code}</b><span>${w.desc}</span><small>${w.name}</small>`;
        div.onclick = () => selectWaste(w, div);
        grid.appendChild(div);
    });

    function selectWaste(waste, el) {
        currentWaste = waste;
        document.querySelectorAll('.quick-tile').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('content-selection-area').style.display = 'block';
        
        const isDanger = waste.code.includes('*');
        document.getElementById('extra-fields').style.display = isDanger ? 'block' : 'none';
        document.getElementById('label-footer').style.display = isDanger ? 'block' : 'none';
        
        const label = document.getElementById('label-render');
        isDanger ? label.classList.add('danger-mode') : label.classList.remove('danger-mode');

        document.getElementById('res-code').innerText = waste.code;
        document.getElementById('res-name').innerText = waste.name;

        const cbDiv = document.getElementById('dynamic-checkboxes');
        cbDiv.innerHTML = waste.items.map(item => `
            <div class="checkbox-item" onclick="toggleOption(this, ${isDanger})">${item}</div>
        `).join('');
        sync();
    }

    function toggleOption(el, isDanger) {
        el.classList.toggle(isDanger ? 'danger-checked' : 'checked');
        sync();
    }

    function previewLogo(event) {
        const file = event.target.files[0];
        if (file) {
            document.getElementById('logo-name').innerText = "OK: " + file.name;
            const reader = new FileReader();
            reader.onload = e => {
                const img = document.getElementById('logo-preview-label');
                img.src = e.target.result;
                img.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    }

    function previewWaste(event) {
        const file = event.target.files[0];
        if (file) {
            document.getElementById('waste-name').innerText = "OK: " + file.name;
            const reader = new FileReader();
            reader.onload = e => {
                const img = document.getElementById('img-waste-label');
                img.src = e.target.result;
                img.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    }

    function sync() {
        if (!currentWaste) return;
        const isDanger = currentWaste.code.includes('*');
        const activeClass = isDanger ? 'danger-checked' : 'checked';
        const selected = Array.from(document.querySelectorAll('.' + activeClass)).map(i => i.innerText);
        const manual = document.getElementById('contentInput').value.toUpperCase();
        let final = selected.join(' / ');
        if (manual) final += (final ? ' / ' : '') + manual;
        document.getElementById('res-content').innerText = final || "---";

        const place = document.getElementById('placeInput').value;
        const zip = [1,2,3,4,5].map(i => document.getElementById('z'+i).value).join('');
        const zipFormatted = zip.length >= 2 ? zip.substring(0,2)+'-'+zip.substring(2) : zip;
        document.getElementById('lbl-place').innerText = place + (zipFormatted ? ", " + zipFormatted : "");
        document.getElementById('lbl-date').innerText = document.getElementById('dateInput').value || "-";
    }

    document.querySelectorAll('.zip-tile').forEach((t, i, arr) => {
        t.oninput = () => { if(t.value && i < 4) arr[i+1].focus(); sync(); };
        t.onkeydown = (e) => { if(e.key === "Backspace" && !t.value && i > 0) arr[i-1].focus(); };
    });

    async function generatePDF() {
        const btn = document.getElementById('btnGen');
        btn.innerText = "GENEROWANIE...";
        btn.disabled = true;
        try {
            const canvas = await html2canvas(document.getElementById('label-render'), { scale: 2, useCORS: true });
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ orientation: 'l', unit: 'mm', format: 'a4' });
            pdf.addImage(imgData, 'PNG', 0, 0, 297, 210);
            pdf.save(`Etykieta_${currentWaste.code.replace('*','')}.pdf`);
        } catch (err) {
            alert("Błąd zapisu.");
        } finally {
            btn.innerText = "POBIERZ ETYKIETĘ (A4 PDF)";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
