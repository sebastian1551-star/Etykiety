<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>GENERATOR ETYKIET ENPROM - PRO EXPERT 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        body { background-color: #e9ecef; font-family: "Century Gothic", "Segoe UI", sans-serif; padding-bottom: 50px; }
        .app-card { max-width: 1100px; margin: 30px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        
        .section-title { font-size: 0.9rem; font-weight: 800; text-transform: uppercase; color: #444; margin-bottom: 15px; display: flex; align-items: center; }
        .section-title span { background: #000; color: #fff; padding: 2px 8px; border-radius: 4px; margin-right: 10px; }

        .quick-select-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 30px; }
        .quick-tile { 
            background: #fff; border: 2px solid #333; padding: 15px; border-radius: 12px; 
            text-align: center; cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; justify-content: center;
        }
        .quick-tile:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .quick-tile b { font-size: 1.1rem; color: #000; display: block; }
        
        .tile-danger { border-color: #ce1126; color: #ce1126; }
        .tile-normal { border-color: #28a745; color: #28a745; }
        .tile-util { border-color: #007bff; color: #007bff; background: #f0f7ff; }
        .tile-board { border-color: #ffc107; color: #856404; background: #fff3cd; }

        #selected-waste-info { display: none; background: #f8f9fa; border: 2px solid #000; padding: 15px; border-radius: 12px; margin-bottom: 20px; justify-content: space-between; align-items: center; }
        #selected-waste-info.danger-info { border-color: #ce1126; background: #fff5f5; }

        #content-selection-area { display: none; border-top: 3px solid #f0f0f0; margin-top: 10px; padding-top: 25px; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .checkbox-item { 
            background: #f8f9fa; border: 1px solid #ddd; padding: 10px; border-radius: 10px; 
            cursor: pointer; font-weight: bold; text-align: center; transition: 0.2s; font-size: 0.85rem;
        }
        .checkbox-item.checked { background: #000; color: #fff; border-color: #000; box-shadow: 0 0 10px rgba(0,0,0,0.3); }
        .checkbox-item.danger-checked { background: #ce1126; color: #fff; border-color: #ce1126; box-shadow: 0 0 10px rgba(206,17,38,0.4); }

        #extra-fields { display: none; padding: 20px; border-radius: 15px; background: #fff5f5; border: 1px solid #ffdada; margin-top: 20px; }
        .zip-tile { width: 38px; height: 42px; text-align: center; font-weight: bold; border: 2px solid #ddd; border-radius: 6px; font-size: 1.2rem; }

        /* RENDERER - HIDDEN FROM VIEW BUT USED BY HTML2CANVAS */
        #label-render { position: absolute; left: -9999px; background: white; color: black; box-sizing: border-box; }
        
        /* Styl Niebezpieczny - A4 Pion */
        #label-render.danger-mode { width: 794px; height: 1122px; border: 15px solid red; padding: 30px; display: block; }
        .dg-title { font-size: 52px; font-weight: 900; text-align: center; margin-bottom: 20px; }
        .dg-row { border: 2px solid black; margin-bottom: -2px; padding: 10px 15px; }
        .dg-label { font-size: 18px; font-weight: bold; display: block; color: #000; text-transform: uppercase; }
        .dg-value-code { font-size: 95px; font-weight: 900; line-height: 1; }
        .dg-value-name { font-size: 32px; font-weight: 800; min-height: 70px; line-height: 1.1; }
        .dg-value-content { font-size: 30px; font-weight: 700; min-height: 110px; line-height: 1.1; }
        
        .dg-table { width: 100%; border-collapse: collapse; margin-top: 0px; }
        .dg-table th { border: 2px solid black; padding: 8px; width: 50%; font-size: 15px; text-align: center; background: #f9f9f9; height: 80px; }
        .dg-table td { border: 2px solid black; padding: 10px; font-size: 20px; font-weight: 900; height: 110px; text-align: center; vertical-align: middle; }

        /* Styl Normalny - A4 Poziom */
        #label-render.normal-mode { width: 1122px; height: 794px; border: 25px solid black; padding: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .nm-logo { font-size: 40px; font-weight: 900; margin-bottom: 20px; border-bottom: 3px solid #000; width: 100%; padding-bottom: 10px; }
        .nm-code { font-size: 150px; font-weight: 900; line-height: 1; }
        .nm-name { font-size: 45px; font-weight: bold; text-transform: uppercase; margin-bottom: 30px; }
        .nm-content { font-size: 50px; font-weight: 900; border-top: 8px solid black; padding-top: 30px; width: 100%; }
        .nm-icon { max-height: 220px; margin-top: 20px; }

        /* Styl Tablicy - CZARNE OBRAMOWANIE */
        #label-render.board-mode { width: 1122px; height: 794px; border: 25px solid black; display: flex; align-items: center; justify-content: center; }
        .board-text { font-size: 110px; font-weight: 900; text-align: center; text-transform: uppercase; padding: 40px; }

        .btn-gen { background: #28a745; color: white; padding: 18px; font-weight: 800; border-radius: 12px; width: 100%; border: none; font-size: 1.5rem; transition: 0.3s; cursor: pointer; }
        .btn-gen:hover { background: #218838; transform: scale(1.02); }
        .btn-gen:disabled { background: #6c757d; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="text-center mb-4">
        <h2 style="font-weight: 900; letter-spacing: -1px;">GENERATOR ETYKIET ENPROM</h2>
    </div>

    <!-- 1. NARZĘDZIA -->
    <div id="nav-tools">
        <div class="section-title"><span>1</span> TYPY ETYKIET I TABLIC</div>
        <div class="quick-select-grid">
            <div class="quick-tile tile-util" onclick="window.open('https://sebastian1551-star.github.io/Wybierak/', '_blank')">
                <b>📚 KATALOG BDO</b>
                <small>Wyszukiwarka kodów</small>
            </div>
            <div class="quick-tile tile-board" onclick="showBoards()">
                <b>⚠️ TABLICE</b>
                <small>Strefy / Zakazy</small>
            </div>
            <div class="quick-tile" onclick="showCommunal()">
                <b>♻️ KOMUNALNE</b>
                <small>Segregacja</small>
            </div>
        </div>

        <div class="section-title"><span>2</span> ODPADY INNE NIŻ NIEBEZPIECZNE</div>
        <div class="quick-select-grid" id="grid-normal"></div>

        <div class="section-title"><span>3</span> ODPADY NIEBEZPIECZNE (*)</div>
        <div class="quick-select-grid" id="grid-danger"></div>
    </div>

    <!-- 3. WYBÓR SZCZEGÓŁÓW -->
    <div id="selected-waste-info">
        <div>
            <strong id="info-code" style="font-size: 1.4rem;"></strong><br>
            <span id="info-name" class="small font-weight-bold"></span>
        </div>
        <button class="btn btn-sm btn-outline-secondary" onclick="resetSelection()">Zresetuj / Powrót</button>
    </div>

    <div id="content-selection-area">
        <div class="row">
            <div class="col-md-6">
                <div class="section-title"><span>A</span> ZAWARTOŚĆ (KLIKNIJ ABY WYBRAĆ)</div>
                <div id="dynamic-checkboxes" class="checkbox-grid"></div>
                <input type="text" id="contentInput" class="form-control form-control-lg" placeholder="Wpisz ręcznie jeśli brak powyżej..." onkeyup="sync()">
                
                <!-- OPCJONALNE LOGO / NAZWA DLA ODPADÓW ZWYKŁYCH -->
                <div id="normal-extra-config" style="display:none;" class="mt-3">
                     <label class="small font-weight-bold">NAGŁÓWEK ETYKIETY (LOGO/NAZWA):</label>
                     <input type="text" id="brandInput" class="form-control" placeholder="Np. ENPROM Sp. z o.o." value="ENPROM" onkeyup="sync()">
                </div>
            </div>

            <div class="col-md-6">
                <div id="extra-fields">
                    <div class="section-title"><span>B</span> LOKALIZACJA I DATA</div>
                    <label class="small mb-1">WYBIERZ MIEJSCOWOŚĆ (AUTO-FILTROWANIE):</label>
                    <input type="text" id="cityInput" list="city-list" class="form-control mb-3" placeholder="Zacznij pisać nazwę bazy..." oninput="handleCityAutoFill(this.value)">
                    <datalist id="city-list"></datalist>

                    <label class="small mb-1">KOD POCZTOWY:</label>
                    <div class="d-flex align-items-center mb-3">
                        <input type="text" class="zip-tile" maxlength="1" id="z1">
                        <input type="text" class="zip-tile" maxlength="1" id="z2">
                        <span style="font-size: 20px; font-weight: bold; margin: 0 5px;">-</span>
                        <input type="text" class="zip-tile" maxlength="1" id="z3">
                        <input type="text" class="zip-tile" maxlength="1" id="z4">
                        <input type="text" class="zip-tile" maxlength="1" id="z5">
                    </div>

                    <label class="small mb-1">ADRES / LOKALIZACJA SZCZEGÓŁOWA:</label>
                    <input type="text" id="streetInput" class="form-control mb-3" placeholder="ulica lub kilometr linii..." onkeyup="sync()">

                    <label class="small mb-1">DATA ROZPOCZĘCIA MAGAZYNOWANIA:</label>
                    <input type="date" id="dateInput" class="form-control" onchange="sync()">
                </div>
            </div>
        </div>

        <button type="button" id="btnGen" onclick="generatePDF()" class="btn-gen mt-5">POBIERZ GOTOWĄ ETYKIETĘ (PDF)</button>
    </div>
</div>

<div id="label-render"></div>

<script>
    const WASTES = [
        { code: "15 01 10*", name: "Opakowania zanieczyszczone subst. niebezpiecznymi", items: ["POJEMNIKI PO FARBACH", "OPAKOWANIA PO SMARACH", "AEROZOLE", "BAŃKI PO CHEMII"] },
        { code: "15 02 02*", name: "Sorbenty, czyściwo, ubrania ochronne (skażone)", items: ["SZMATY OLEJOWE", "SORBENT", "FILTRY OLEJU", "ZUŻYTE RĘKAWICE"] },
        { code: "16 02 13*", name: "Zużyte urządzenia (niebezpieczne)", items: ["KOMPUTERY/MONITORY", "ELEKTRONARZĘDZIA", "TRANSFORMATORY"] },
        { code: "17 04 10*", name: "Kable zawierające ropę, smołę", items: ["KABLE OLEJOWE", "KABLE SMOLOWANE"] },
        { code: "16 06 01*", name: "Baterie i akumulatory ołowiowe", items: ["AKUMULATORY POJAZDOWE", "BATERIE UPS"] },
        { code: "17 04 07", name: "Mieszaniny metali", items: ["METALE KOLOROWE", "ZŁOM MIESZANY", "ELEMENTY OSPRZĘTU"] },
        { code: "17 04 11", name: "Kable inne niż 17 04 10", items: ["KABLE CU (MIEDŹ)", "KABLE AL (ALUMINIUM)", "KABLE IZOLOWANE"] },
        { code: "17 04 05", name: "Żelazo i stal", items: ["KONSTRUKCJE STALOWE", "RURY I PROFILE", "PRĘTY ZBROJENIOWE"] },
        { code: "17 02 01", name: "Drewno", items: ["PALETY EURO", "USZKODZONE SKRZYNIE", "DESKI SZALUNKOWE"] },
        { code: "17 09 04", name: "Zmieszane odpady z budowy", items: ["GRUZ", "CERAMIKA", "PŁYTY G-K"] }
        { code: "15 01 01", name: "Opakowania z papieru i tektury", items: ["KARTONY", "PAPIER PAKOWY", "TULEJE"] },
        { code: "15 01 02", name: "Opakowania z tworzyw sztucznych", items: ["FOLIA STRETCH", "BAŃKI CZYSTE", "BUTELKI PET", "PALETY PLASTIKOWE"] },
    ];

    const COMMUNAL = [
        { code: "20 01 01", name: "PAPIER I TEKTURA", img: "https://cdn-icons-png.flaticon.com/512/2541/2541991.png" },
        { code: "20 01 02", name: "SZKŁO", img: "https://cdn-icons-png.flaticon.com/512/5029/5029191.png" },
        { code: "20 01 39", name: "TWORZYWA I METALE", img: "https://cdn-icons-png.flaticon.com/512/2666/2666631.png" },
        { code: "20 03 01", name: "ZMIESZANE", img: "https://cdn-icons-png.flaticon.com/512/1165/1165651.png" },
        { code: "20 02 01", name: "BIO", img: "https://cdn-icons-png.flaticon.com/512/2316/2316524.png" }
    ];

    const BOARDS = ["ODPADY NIEBEZPIECZNE", "STREFA MAGAZYNOWANIA ODPADÓW", "PUNKT ZBIERANIA ODPADÓW", "MIEJSCE GROMADZENIA ODPADÓW", "ZAKAZ PALENIA"];
    
    const LOCATIONS = [
        { name: "Ustka (Duninowo)", zip: "76270", street: "Duninowo 39" },
        { name: "Polkowice", zip: "59100", street: "ul. Energetyków 3" },
        { name: "Zabrze (Rokitnica)", zip: "42674", street: "ul. Żniwna" },
        { name: "Lutkówka Druga", zip: "96320", street: "Grójecka 24" },
        { name: "Leszno (Gronówko)", zip: "64111", street: "Gronówko 30" }
    ];

    let currentMode = "normal";
    let currentWaste = null;

    window.onload = () => {
        const gn = document.getElementById('grid-normal');
        const gd = document.getElementById('grid-danger');
        WASTES.forEach(w => {
            const isD = w.code.includes('*');
            const div = document.createElement('div');
            div.className = `quick-tile ${isD ? 'tile-danger' : 'tile-normal'}`;
            div.innerHTML = `<b>${w.code}</b><small style="font-size:0.7rem">${w.name}</small>`;
            div.onclick = () => selectWaste(w);
            if(isD) gd.appendChild(div); else gn.appendChild(div);
        });
        const dl = document.getElementById('city-list');
        LOCATIONS.forEach(l => { let o = document.createElement('option'); o.value = l.name; dl.appendChild(o); });
    };

    function selectWaste(waste) {
        currentWaste = waste;
        currentMode = waste.code.includes('*') ? "danger" : "normal";
        setupUI(waste.name);
        renderLabelTemplate();
        document.getElementById('dynamic-checkboxes').innerHTML = (waste.items || []).map(i => 
            `<div class="checkbox-item" onclick="toggleOption(this)">${i}</div>`
        ).join('');
        sync();
    }

    function showCommunal() {
        currentMode = "normal";
        currentWaste = { code: "", name: "KOMUNALNE" };
        setupUI("Odpady Komunalne");
        document.getElementById('dynamic-checkboxes').innerHTML = COMMUNAL.map(c => `
            <div class="checkbox-item" onclick="selectCommunalItem('${c.code}', '${c.name}', '${c.img}')">
                ${c.name}<br><small>${c.code}</small>
            </div>
        `).join('');
    }

    function selectCommunalItem(code, name, img) {
        currentWaste = { code, name, img };
        renderLabelTemplate();
        sync();
    }

    function showBoards() {
        currentMode = "board";
        currentWaste = { code: "TABLICA", name: "Wybierz treść" };
        setupUI("Tablice Informacyjne");
        document.getElementById('dynamic-checkboxes').innerHTML = BOARDS.map(b => 
            `<div class="checkbox-item" onclick="selectBoard('${b}')">${b}</div>`
        ).join('');
    }

    function selectBoard(text) {
        currentWaste = { code: "TABLICA", name: text };
        renderLabelTemplate();
        sync();
    }

    function setupUI(title) {
        document.getElementById('nav-tools').style.display = 'none';
        document.getElementById('selected-waste-info').style.display = 'flex';
        document.getElementById('info-code').innerText = currentWaste?.code || "";
        document.getElementById('info-name').innerText = title;
        document.getElementById('content-selection-area').style.display = 'block';
        document.getElementById('extra-fields').style.display = (currentMode === "danger") ? 'block' : 'none';
        document.getElementById('normal-extra-config').style.display = (currentMode === "normal") ? 'block' : 'none';
    }

    function renderLabelTemplate() {
        const r = document.getElementById('label-render');
        if (currentMode === "danger") {
            r.className = "danger-mode";
            r.innerHTML = `
                <div class="dg-title">ODPADY NIEBEZPIECZNE</div>
                <div class="dg-row"><span class="dg-label">KOD ODPADU</span><div id="res-code" class="dg-value-code"></div></div>
                <div class="dg-row"><span class="dg-label">RODZAJ MAGAZYNOWANYCH ODPADÓW</span><div id="res-name" class="dg-value-name"></div></div>
                <div class="dg-row"><span class="dg-label">ZAWARTOŚĆ</span><div id="res-content" class="dg-value-content"></div></div>
                <table class="dg-table">
                    <tr><th>ADRES MIEJSCA MAGAZYNOWANIA ODPADÓW</th><th>DATA ROZPOCZĘCIA MAGAZYNOWANIA W DANYM MIEJSCU</th></tr>
                    <tr><td id="res-addr"></td><td id="res-date"></td></tr>
                    <tr><td></td><td></td></tr>
                    <tr><td></td><td></td></tr>
                </table>
                <div class="dg-row" style="border:none; margin-top:15px; font-size:11px; font-style:italic">Etykieta zgodna z Rozporządzeniem Ministra Klimatu z dnia 11 września 2020 r.</div>
            `;
        } else if (currentMode === "board") {
            r.className = "board-mode";
            r.innerHTML = `<div id="res-board" class="board-text"></div>`;
        } else {
            r.className = "normal-mode";
            r.innerHTML = `
                <div id="res-brand" class="nm-logo">ENPROM</div>
                <div id="res-code" class="nm-code"></div>
                <div id="res-name" class="nm-name"></div>
                <div id="res-content" class="nm-content"></div>
                <img id="res-img" class="nm-icon" src="" crossorigin="anonymous">
            `;
        }
    }

    function toggleOption(el) {
        el.classList.toggle(currentMode === 'danger' ? 'danger-checked' : 'checked');
        sync();
    }

    function sync() {
        if (!currentWaste) return;
        const selSelector = currentMode === 'danger' ? '.danger-checked' : '.checked';
        const sel = Array.from(document.querySelectorAll(selSelector)).map(i => i.innerText.split('\n')[0]);
        const man = document.getElementById('contentInput').value.toUpperCase();
        const contentText = (sel.join(' / ') + (man ? (sel.length > 0 ? ' / ' : '') + man : "")) || "---";

        if (currentMode === "danger") {
            document.getElementById('res-code').innerText = currentWaste.code || "";
            document.getElementById('res-name').innerText = (currentWaste.name || "").toUpperCase();
            document.getElementById('res-content').innerText = contentText;
            const zip = [1,2,3,4,5].map(i => document.getElementById('z'+i).value).join('');
            const fullZip = zip.length >= 2 ? zip.substring(0,2)+'-'+zip.substring(2) : zip;
            const addr = [fullZip, document.getElementById('cityInput').value, document.getElementById('streetInput').value].filter(Boolean).join(', ');
            document.getElementById('res-addr').innerText = addr;
            document.getElementById('res-date').innerText = document.getElementById('dateInput').value;
        } else if (currentMode === "board") {
            document.getElementById('res-board').innerText = currentWaste.name;
        } else {
            document.getElementById('res-code').innerText = currentWaste.code || "";
            document.getElementById('res-name').innerText = (currentWaste.name || "").toUpperCase();
            document.getElementById('res-content').innerText = contentText;
            document.getElementById('res-brand').innerText = document.getElementById('brandInput').value || "ENPROM";
            const img = document.getElementById('res-img');
            if(currentWaste.img) {
                img.src = currentWaste.img;
                img.style.display = 'block';
            } else {
                img.style.display = 'none';
            }
        }
    }

    async function generatePDF() {
        const btn = document.getElementById('btnGen');
        btn.innerText = "⏳ TRWA GENEROWANIE...";
        btn.disabled = true;

        try {
            const orient = (currentMode === "danger") ? 'p' : 'l';
            const canvas = await html2canvas(document.getElementById('label-render'), { 
                scale: 2.5,
                useCORS: true,
                allowTaint: true
            });
            
            const pdf = new jspdf.jsPDF({ orientation: orient, unit: 'mm', format: 'a4', compress: true });
            const w = orient === 'p' ? 210 : 297;
            const h = orient === 'p' ? 297 : 210;
            
            pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, w, h);
            pdf.save(`Etykieta_${currentWaste.code.replace('*','') || "Tablica"}.pdf`);
        } catch (e) {
            console.error(e);
            alert("Błąd generowania PDF.");
        } finally {
            btn.innerText = "POBIERZ GOTOWĄ ETYKIETĘ (PDF)";
            btn.disabled = false;
        }
    }

    function handleCityAutoFill(val) {
        const found = LOCATIONS.find(l => l.name.toLowerCase().includes(val.toLowerCase()));
        if(found && val.length > 2) {
            found.zip.split('').forEach((d, i) => { document.getElementById('z'+(i+1)).value = d; });
            document.getElementById('streetInput').value = found.street;
        }
        sync();
    }

    function resetSelection() { location.reload(); }
    
    document.querySelectorAll('.zip-tile').forEach((t, i, arr) => {
        t.oninput = () => { if(t.value && i < 4) arr[i+1].focus(); sync(); };
        t.onkeydown = (e) => { if(e.key === 'Backspace' && !t.value && i > 0) { arr[i-1].focus(); } };
    });
</script>

</body>
</html>
