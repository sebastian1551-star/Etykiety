<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>GENERATOR ETYKIET ENPROM - FINAL</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        body { background-color: #f0f2f5; font-family: "Century Gothic", sans-serif; padding: 20px; }
        .app-container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        /* Wybór odpadu */
        .waste-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 25px; }
        .waste-tile { 
            border: 2px solid #333; padding: 15px; border-radius: 12px; text-align: center; cursor: pointer; transition: 0.2s;
        }
        .waste-tile.danger { border-color: #ce1126; color: #ce1126; }
        .waste-tile.active { background: #333; color: white; }
        .waste-tile.danger.active { background: #ce1126; color: white; border-color: #ce1126; }

        /* Formularz */
        #form-section { display: none; border-top: 3px solid #eee; padding-top: 25px; }
        .tag-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin: 15px 0; }
        .tag-btn { background: #f8f9fa; border: 1px solid #ddd; padding: 10px; border-radius: 8px; cursor: pointer; text-align: center; font-weight: bold; font-size: 13px; }
        .tag-btn.selected-danger { background: #ce1126; color: white; border-color: #ce1126; }
        .tag-btn.selected-normal { background: #000; color: white; border-color: #000; }

        .zip-box { display: flex; gap: 5px; margin-bottom: 15px; }
        .zip-unit { width: 40px; height: 45px; text-align: center; font-weight: bold; border: 2px solid #ddd; border-radius: 6px; font-size: 1.2rem; }

        /* --- WIZUALIZACJA ETYKIETY (A4) --- */
        #label-render {
            width: 1122px; height: 794px; position: absolute; left: -9999px; 
            background: white; border: 22px solid #ce1126; 
            display: flex; flex-direction: column; padding: 35px 50px; box-sizing: border-box; color: black;
        }
        #label-render.normal-mode { border-color: black; }

        .lbl-top { height: 60px; margin-bottom: 10px; }
        #lbl-logo-img { max-height: 55px; max-width: 250px; object-fit: contain; }

        .lbl-banner { 
            font-size: 80px; font-weight: 900; color: #ce1126; text-align: center;
            border-bottom: 8px solid #ce1126; line-height: 1; padding-bottom: 10px; margin-bottom: 20px;
        }

        .lbl-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; overflow: hidden; }
        #lbl-code-val { font-size: 210px; font-weight: 900; line-height: 0.8; letter-spacing: -6px; margin: 0; }
        #lbl-name-val { font-size: 38px; font-weight: 900; text-transform: uppercase; margin-top: 5px; width: 95%; line-height: 1.1; }
        
        .lbl-mid-section { 
            width: 100%; border-top: 8px solid #ce1126; padding-top: 20px; margin-top: 20px;
            display: flex; align-items: center; justify-content: center; min-height: 130px;
        }
        #lbl-render.normal-mode .lbl-mid-section { border-top-color: black; }
        #lbl-tags-val { font-size: 90px; font-weight: 900; text-transform: uppercase; line-height: 1; flex: 1; }
        
        #lbl-photo-box { width: 400px; height: 280px; border: 1px solid #eee; margin-left: 25px; display: flex; align-items: center; justify-content: center; }
        #lbl-photo-img { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* ADRESY */
        .lbl-footer { width: 100%; margin-top: auto; }
        .lbl-box-line { border: 5px solid #ce1126; padding: 10px 20px; margin-bottom: 10px; font-size: 28px; font-weight: 900; text-transform: uppercase; }
        .lbl-box-dash { border: 5px dashed #ce1126; padding: 10px 20px; font-size: 28px; font-weight: 900; text-transform: uppercase; }
        .lbl-date-line { font-size: 22px; font-weight: bold; text-align: right; margin-top: 10px; }

        .btn-main { background: #28a745; color: white; padding: 18px; font-weight: 900; border-radius: 12px; width: 100%; border: none; font-size: 1.4rem; margin-top: 25px; transition: 0.3s; }
        .btn-main:hover { background: #218838; transform: scale(1.01); }
    </style>
</head>
<body>

<div class="app-container">
    <h3 class="text-center mb-4"><b>GENERATOR ETYKIET ENPROM</b></h3>
    <div class="waste-grid" id="grid"></div>

    <div id="form-section">
        <div class="row">
            <div class="col-md-6">
                <p class="small font-weight-bold">ZAWARTOŚĆ (WYBIERZ LUB DOPISZ):</p>
                <div id="tag-container" class="tag-grid"></div>
                <input type="text" id="customInput" class="form-control form-control-lg" placeholder="Inna zawartość..." onkeyup="sync()">
                <div class="row mt-3">
                    <div class="col-6"><button class="btn btn-outline-secondary btn-block btn-sm" onclick="document.getElementById('logoIn').click()">LOGO FIRMY</button></div>
                    <div class="col-6"><button id="fotoBtn" class="btn btn-outline-secondary btn-block btn-sm" onclick="document.getElementById('wasteIn').click()">FOTO ODPADU</button></div>
                </div>
                <input type="file" id="logoIn" hidden onchange="loadLogo(event)">
                <input type="file" id="wasteIn" hidden onchange="loadWaste(event)">
            </div>
            <div class="col-md-6">
                <p class="small font-weight-bold">LOKALIZACJA MAGAZYNOWANIA:</p>
                <div class="zip-box">
                    <input type="text" class="zip-unit" maxlength="1" id="z1">
                    <input type="text" class="zip-unit" maxlength="1" id="z2">
                    <span style="font-size: 24px; font-weight: bold; padding-top: 5px;">-</span>
                    <input type="text" class="zip-unit" maxlength="1" id="z3">
                    <input type="text" class="zip-unit" maxlength="1" id="z4">
                    <input type="text" class="zip-unit" maxlength="1" id="z5">
                </div>
                <input type="text" id="cityIn" list="cities" class="form-control mb-2" placeholder="Miejscowość (zacznij pisać...)" oninput="sync()">
                <datalist id="cities">
                    <option value="Otwock"><option value="Lutkówka Druga"><option value="Warszawa"><option value="Karczew"><option value="Góra Kalwaria"><option value="Lublin"><option value="Katowice">
                </datalist>
                <input type="text" id="streetIn" class="form-control mb-2" placeholder="Ulica / Nr działki..." onkeyup="sync()">
                <input type="date" id="dateIn" class="form-control" onchange="sync()">
            </div>
        </div>
        <button onclick="savePDF()" class="btn-main">POBIERZ ETYKIETĘ PDF (A4)</button>
    </div>
</div>

<div id="label-render">
    <div class="lbl-top"><img id="lbl-logo-img" src=""></div>
    <div id="lbl-danger-txt" class="lbl-banner">ODPAD NIEBEZPIECZNY</div>
    
    <div class="lbl-body">
        <div id="lbl-code-val">00 00 00</div>
        <div id="lbl-name-val">NAZWA ODPADU</div>
        <div class="lbl-mid-section">
            <div id="lbl-tags-val">---</div>
            <div id="lbl-photo-box"><img id="lbl-photo-img" src=""></div>
        </div>
    </div>
    
    <div class="lbl-footer" id="lbl-address-sec">
        <div class="lbl-box-solid">MIEJSCE: <span id="lbl-final-addr" class="ml-2"></span></div>
        <div class="lbl-box-dash">ZMIANA MIEJSCA:</div>
    </div>
    <div class="lbl-date-line" id="lbl-date-sec">DATA ROZPOCZĘCIA MAGAZYNOWANIA: <span id="lbl-final-date"></span></div>
</div>

<script>
    const WASTES = [
        { code: "15 01 10*", name: "Opakowania zawierające pozostałości substancji niebezpiecznych lub nimi zanieczyszczone", tags: ["FARBY", "LAKIERY", "SPRAYE", "CHEMIA"] },
        { code: "15 02 02*", name: "Sorbenty, materiały filtracyjne, tkaniny do wycierania i ubrania ochronne zanieczyszczone substancjami niebezpiecznymi", tags: ["SZMATY", "CZYŚCIWO", "FILTRY", "SORBENT"] },
        { code: "17 04 05", name: "Żelazo i stal", tags: ["ZŁOM", "RURY", "PROFILE"] },
        { code: "17 02 01", name: "Drewno", tags: ["PALETY", "DESKI", "SKRZYNIE"] },
        { code: "15 01 02", name: "Opakowania z tworzyw sztucznych", tags: ["FOLIA", "BAŃKI", "STRAPING"] }
    ];

    const ZIP_DATA = { "96323": "Lutkówka Druga", "05400": "Otwock", "00001": "Warszawa" };
    let currentWaste = null;

    window.onload = () => {
        const grid = document.getElementById('grid');
        WASTES.forEach(w => {
            const div = document.createElement('div');
            const isD = w.code.includes('*');
            div.className = `waste-tile ${isD ? 'danger' : ''}`;
            div.innerHTML = `<b>${w.code}</b><br><small>${w.code.includes('15 01 10') ? 'Opakowania niebezp.' : w.name.substring(0,25)+'...'}</small>`;
            div.onclick = () => select(w, div);
            grid.appendChild(div);
        });
        const logo = localStorage.getItem('enprom_logo_path');
        if (logo) document.getElementById('lbl-logo-img').src = logo;
    };

    function select(waste, el) {
        currentWaste = waste;
        document.querySelectorAll('.waste-tile').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('form-section').style.display = 'block';
        
        const isD = waste.code.includes('*');
        const render = document.getElementById('label-render');
        
        // Stylistyka Danger vs Normal
        if(isD) {
            render.classList.remove('normal-mode');
            document.getElementById('lbl-danger-txt').style.display = "block";
            document.getElementById('lbl-address-sec').style.display = "block";
            document.getElementById('lbl-date-sec').style.display = "block";
            document.getElementById('lbl-photo-box').style.display = "none";
            document.getElementById('fotoBtn').disabled = true;
        } else {
            render.classList.add('normal-mode');
            document.getElementById('lbl-danger-txt').style.display = "none";
            document.getElementById('lbl-address-sec').style.display = "none";
            document.getElementById('lbl-date-sec').style.display = "none";
            document.getElementById('lbl-photo-box').style.display = "flex";
            document.getElementById('fotoBtn').disabled = false;
        }

        document.getElementById('lbl-code-val').innerText = waste.code;
        document.getElementById('lbl-name-val').innerText = waste.name;
        document.getElementById('tag-container').innerHTML = waste.tags.map(t => 
            `<div class="tag-btn" onclick="toggleTag(this, ${isD})">${t}</div>`).join('');
        
        sync();
    }

    function toggleTag(el, isD) {
        el.classList.toggle(isD ? 'selected-danger' : 'selected-normal');
        sync();
    }

    function loadLogo(e) {
        const r = new FileReader();
        r.onload = ev => { document.getElementById('lbl-logo-img').src = ev.target.result; localStorage.setItem('enprom_logo_path', ev.target.result); };
        r.readAsDataURL(e.target.files[0]);
    }

    function loadWaste(e) {
        const r = new FileReader();
        r.onload = ev => { document.getElementById('lbl-photo-img').src = ev.target.result; };
        r.readAsDataURL(e.target.files[0]);
    }

    function sync() {
        if (!currentWaste) return;
        const isD = currentWaste.code.includes('*');
        
        const sel = Array.from(document.querySelectorAll(isD ? '.selected-danger' : '.selected-normal')).map(i => i.innerText);
        const custom = document.getElementById('customInput').value.toUpperCase();
        let combined = sel.join(' / ');
        if (custom) combined += (combined ? ' / ' : '') + custom;
        document.getElementById('lbl-tags-val').innerText = combined || "---";

        const zip = [1,2,3,4,5].map(i => document.getElementById('z1','z2','z3','z4','z5').value); // uproszczone
        const zStr = document.getElementById('z1').value + document.getElementById('z2').value + document.getElementById('z3').value + document.getElementById('z4').value + document.getElementById('z5').value;
        
        if(zStr.length === 5 && ZIP_DATA[zStr] && !document.getElementById('cityIn').value) {
            document.getElementById('cityIn').value = ZIP_DATA[zStr];
        }

        const city = document.getElementById('cityIn').value;
        const street = document.getElementById('streetIn').value;
        const formattedZip = zStr.length === 5 ? zStr.substring(0,2)+'-'+zStr.substring(2) : zStr;
        
        let addr = [];
        if(formattedZip) addr.push(formattedZip);
        if(city) addr.push(city);
        if(street) addr.push(street);
        
        document.getElementById('lbl-final-addr').innerText = addr.join(', ') || "";
        document.getElementById('lbl-final-date').innerText = document.getElementById('dateIn').value || "";
    }

    document.querySelectorAll('.zip-unit').forEach((t, i, arr) => {
        t.oninput = () => { if(t.value && i < 4) arr[i+1].focus(); sync(); };
        t.onkeydown = (e) => { if(e.key === "Backspace" && !t.value && i > 0) arr[i-1].focus(); };
    });

    async function savePDF() {
        const btn = document.querySelector('.btn-main');
        btn.innerText = "GENEROWANIE PDF...";
        const canvas = await html2canvas(document.getElementById('label-render'), { scale: 2 });
        const pdf = new jspdf.jsPDF({ orientation: 'l', unit: 'mm', format: 'a4' });
        pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 297, 210);
        pdf.save(`Etykieta_${currentWaste.code.replace('*','')}.pdf`);
        btn.innerText = "POBIERZ ETYKIETĘ PDF (A4)";
    }
</script>
</body>
</html>
