<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>GENERATOR ETYKIET ENPROM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        body { background-color: #f0f2f5; font-family: "Century Gothic", sans-serif; padding-bottom: 50px; }
        .app-card { max-width: 900px; margin: 20px auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        
        /* KAFLE DLA LAIKA */
        .quick-select-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .quick-tile { 
            background: #fff; border: 3px solid #000; padding: 20px; border-radius: 12px; 
            text-align: center; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; min-height: 150px;
        }
        .quick-tile:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .quick-tile b { font-size: 1.5rem; display: block; color: #000; }
        .quick-tile span { font-size: 1.1rem; font-weight: 900; text-transform: uppercase; color: #333; margin: 5px 0; }
        .quick-tile small { font-size: 0.85rem; color: #666; border-top: 1px solid #eee; padding-top: 5px; }
        
        /* KOLORY OSTRZEGAWCZE */
        .quick-tile.danger { border-color: #ce1126; }
        .quick-tile.danger span { color: #ce1126; }
        .quick-tile.active { background: #000 !important; color: #fff !important; }
        .quick-tile.active span, .quick-tile.active small { color: #fff !important; }
        .quick-tile.danger.active { background: #ce1126 !important; border-color: #ce1126 !important; }

        /* SEKCJA ZAWARTOŚCI */
        #content-selection-area { display: none; border-top: 2px solid #eee; margin-top: 20px; padding-top: 20px; }
        .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .checkbox-item { background: #f8f9fa; border: 2px solid #dee2e6; padding: 15px; border-radius: 10px; cursor: pointer; font-weight: bold; text-align: center; }
        .checkbox-item.checked { background: #000; color: #fff; border-color: #000; }
        .checkbox-item.danger-checked { background: #ce1126; color: #fff; border-color: #ce1126; }

        /* ZDJĘCIE */
        .photo-upload-box { background: #e9ecef; border: 2px dashed #adb5bd; padding: 20px; text-align: center; border-radius: 10px; margin-bottom: 20px; }

        /* POLA DLA NIEBEZPIECZNYCH */
        #extra-fields { display: none; padding: 20px; border-radius: 12px; background: #fff5f5; border: 2px solid #feb2b2; margin-bottom: 20px; }
        .zip-container { display: flex; align-items: center; gap: 5px; }
        .zip-tile { width: 45px; height: 45px; text-align: center; font-size: 20px; font-weight: bold; border: 2px solid #ccc; border-radius: 5px; }

        /* --- RENDERER ETYKIETY (A4 POZIOMO) --- */
        #label-render {
            width: 1122px; height: 794px; position: absolute; left: -9999px; 
            background: white; border: 25px solid black; display: flex; flex-direction: column; 
            padding: 40px; box-sizing: border-box; color: black;
        }
        #label-render.danger-mode { border-color: #ce1126 !important; }
        .logo-row { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 20px; }
        .logo-text { font-size: 45px; font-weight: 900; letter-spacing: 5px; }
        
        #danger-header { 
            display: none; font-size: 60px; font-weight: 900; color: #ce1126; 
            border-bottom: 12px solid #ce1126; width: 100%; text-align: center; margin-bottom: 20px;
        }
        #label-render.danger-mode #danger-header { display: block; }

        .main-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        #res-code { font-size: 160px; font-weight: 900; line-height: 0.8; margin: 0; }
        #res-name { font-size: 36px; text-transform: uppercase; font-weight: bold; margin-bottom: 20px; max-width: 900px; }
        
        .photo-and-desc { display: flex; align-items: center; justify-content: center; gap: 40px; width: 100%; border-top: 6px solid #000; padding-top: 20px; }
        #label-render.danger-mode .photo-and-desc { border-top-color: #ce1126; }
        
        #res-content { font-size: 55px; font-weight: 900; text-transform: uppercase; line-height: 1.1; flex: 1; }
        #img-preview-label { max-width: 350px; max-height: 250px; border: 5px solid #eee; object-fit: cover; display: none; }

        .footer-info { width: 100%; margin-top: 30px; display: none; }
        .footer-info table { width: 100%; font-size: 22px; font-weight: bold; border-collapse: collapse; }
        .footer-info td { border: 2px solid #ce1126; padding: 15px; width: 50%; }

        .btn-gen { background: #28a745; color: white; padding: 20px; font-weight: bold; border-radius: 12px; width: 100%; border: none; font-size: 1.6rem; transition: 0.3s; }
        .btn-gen:hover { background: #218838; transform: scale(1.01); }
    </style>
</head>
<body>

<div class="app-card">
    <h2 class="text-center mb-4"><b>SYSTEM ETYKIETOWANIA ODPADÓW</b></h2>
    
    <p class="text-center text-muted">KROK 1: Wybierz rodzaj odpadu</p>
    <div class="quick-select-grid" id="quick-grid"></div>

    <div id="content-selection-area">
        <div class="row">
            <div class="col-md-6">
                <p><b>KROK 2: Co jest w środku?</b></p>
                <div id="dynamic-checkboxes" class="checkbox-grid"></div>
                <input type="text" id="contentInput" class="form-control form-control-lg mb-3" placeholder="Inny opis / uwagi..." onkeyup="sync()">
            </div>
            <div class="col-md-6">
                <p><b>KROK 3: Zdjęcie (Opcjonalnie)</b></p>
                <div class="photo-upload-box">
                    <input type="file" accept="image/*" id="file-input" onchange="previewImage(event)" style="display: none;">
                    <button class="btn btn-secondary btn-block" onclick="document.getElementById('file-input').click()">📸 WYBIERZ ZDJĘCIE / ZRÓB FOTKĘ</button>
                    <div id="file-name" class="small mt-2">Brak zdjęcia</div>
                </div>
            </div>
        </div>

        <div id="extra-fields">
            <h5 class="text-danger"><b>DANE DLA ODPADU NIEBEZPIECZNEGO:</b></h5>
            <div class="row">
                <div class="col-md-7">
                    <label>MIEJSCE SKŁADOWANIA:</label>
                    <input type="text" id="placeInput" class="form-control" placeholder="Np. Magazyn nr 1, ul. Przemysłowa" onkeyup="sync()">
                </div>
                <div class="col-md-5">
                    <label>KOD POCZTOWY:</label>
                    <div class="zip-container">
                        <input type="text" class="zip-tile" maxlength="1" id="z1">
                        <input type="text" class="zip-tile" maxlength="1" id="z2">
                        <span>-</span>
                        <input type="text" class="zip-tile" maxlength="1" id="z3">
                        <input type="text" class="zip-tile" maxlength="1" id="z4">
                        <input type="text" class="zip-tile" maxlength="1" id="z5">
                    </div>
                </div>
                <div class="col-md-6 mt-3">
                    <label>DATA ROZPOCZĘCIA:</label>
                    <input type="date" id="dateInput" class="form-control" onchange="sync()">
                </div>
            </div>
        </div>

        <button type="button" id="btnGen" onclick="generatePDF()" class="btn-gen mt-3">POBIERZ ETYKIETĘ (A4 - PDF)</button>
    </div>
</div>

<div id="label-render">
    <div class="logo-row">
        <div class="logo-text">ENPROM</div>
        <div style="font-size: 20px; font-weight: bold;">ETYKIETA ODPADU</div>
    </div>
    
    <div id="danger-header">ODPAD NIEBEZPIECZNY</div>
    
    <div class="main-content">
        <div id="res-code">00 00 00</div>
        <div id="res-name">NAZWA ODPADU</div>
        
        <div class="photo-and-desc">
            <div id="res-content">---</div>
            <img id="img-preview-label" src="">
        </div>
    </div>
    
    <div class="footer-info" id="label-footer">
        <table>
            <tr>
                <td>MIEJSCE: <span id="lbl-place">-</span></td>
                <td>DATA: <span id="lbl-date">-</span></td>
            </tr>
        </table>
    </div>
</div>

<script>
    // BAZA DANYCH - TUTAJ ŁATWO DODASZ NOWE KODY
    const WASTES = [
        { code: "15 01 10*", name: "Opakowania niebezpieczne", desc: "FARBY, LAKIERY, CHEMIA", items: ["FARBY", "LAKIERY", "SPRAYE", "CHEMIA", "PIANKI"] },
        { code: "15 02 02*", name: "Sorbenty i czyściwo", desc: "SZMATY OLEJOWE, FILTRY", items: ["SZMATY", "CZYŚCIWO", "FILTRY", "SORBENT"] },
        { code: "16 02 13*", name: "Zużyta elektronika", desc: "SPRZĘT RTV/AGD, KABLE", items: ["KOMPUTERY", "ELEKTRONIKA", "BATERIE", "KABLE"] },
        { code: "15 01 01", name: "Papier i Tektura", desc: "KARTONY I WORKI", items: ["KARTONY", "PAPIER", "TEKTURA"] },
        { code: "15 01 02", name: "Plastik / Folia", desc: "FOLIA CZYSTA I OPAKOWANIA", items: ["FOLIA", "STRAPING", "BAŃKI"] },
        { code: "17 04 05", name: "Żelazo i stal", desc: "ZŁOM I KONSTRUKCJE", items: ["ZŁOM", "RURY", "DRUTY", "PROFILE"] },
        { code: "17 02 01", name: "Drewno", desc: "PALETY, DESKI, SKRZYNIE", items: ["PALETY", "DESKI", "SKRZYNIE"] }
    ];

    let currentWaste = null;
    const grid = document.getElementById('quick-grid');

    // Generowanie kafli
    WASTES.forEach(w => {
        const isDanger = w.code.includes('*');
        const div = document.createElement('div');
        div.className = `quick-tile ${isDanger ? 'danger' : ''}`;
        div.innerHTML = `<b>${w.code}</b><span>${w.desc}</span><small>${w.name}</small>`;
        div.onclick = () => selectWaste(w, div);
        grid.appendChild(div);
    });

    function selectWaste(waste, el) {
        currentWaste = waste;
        document.querySelectorAll('.quick-tile').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        
        document.getElementById('content-selection-area').style.display = 'block';
        const isDanger = waste.code.includes('*');
        
        // Zarządzanie widokiem niebezpiecznych
        document.getElementById('extra-fields').style.display = isDanger ? 'block' : 'none';
        document.getElementById('label-footer').style.display = isDanger ? 'block' : 'none';
        const label = document.getElementById('label-render');
        isDanger ? label.classList.add('danger-mode') : label.classList.remove('danger-mode');

        document.getElementById('res-code').innerText = waste.code;
        document.getElementById('res-name').innerText = waste.name;

        // Checkboxy
        const cbDiv = document.getElementById('dynamic-checkboxes');
        cbDiv.innerHTML = waste.items.map(item => `
            <div class="checkbox-item" onclick="toggleOption(this, ${isDanger})">${item}</div>
        `).join('');

        sync();
    }

    function toggleOption(el, isDanger) {
        el.classList.toggle(isDanger ? 'danger-checked' : 'checked');
        sync();
    }

    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            document.getElementById('file-name').innerText = "Wybrano: " + file.name;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('img-preview-label');
                img.src = e.target.result;
                img.style.display = 'block';
            }
            reader.readAsDataURL(file);
        }
    }

    function sync() {
        if (!currentWaste) return;
        const isDanger = currentWaste.code.includes('*');
        const activeClass = isDanger ? 'danger-checked' : 'checked';
        
        const selected = Array.from(document.querySelectorAll('.' + activeClass)).map(i => i.innerText);
        const manual = document.getElementById('contentInput').value.toUpperCase();
        
        let final = selected.join(' / ');
        if (manual) final += (final ? ' / ' : '') + manual;
        document.getElementById('res-content').innerText = final || "---";

        // Adres i Data
        const place = document.getElementById('placeInput').value;
        const zip = [1,2,3,4,5].map(i => document.getElementById('z'+i).value).join('');
        const zipFormatted = zip.length >= 2 ? zip.substring(0,2)+'-'+zip.substring(2) : zip;
        
        document.getElementById('lbl-place').innerText = place + (zipFormatted ? ", " + zipFormatted : "");
        document.getElementById('lbl-date').innerText = document.getElementById('dateInput').value || "-";
    }

    // Auto-skok kursora w kodzie pocztowym
    document.querySelectorAll('.zip-tile').forEach((t, i, arr) => {
        t.oninput = () => { if(t.value && i < 4) arr[i+1].focus(); sync(); };
        t.onkeydown = (e) => { if(e.key === "Backspace" && !t.value && i > 0) arr[i-1].focus(); };
    });

    async function generatePDF() {
        const btn = document.getElementById('btnGen');
        btn.innerText = "GENEROWANIE PDF...";
        btn.disabled = true;

        try {
            const canvas = await html2canvas(document.getElementById('label-render'), { 
                scale: 2, 
                useCORS: true 
            });
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ orientation: 'l', unit: 'mm', format: 'a4' });
            pdf.addImage(imgData, 'PNG', 0, 0, 297, 210);
            pdf.save(`Etykieta_${currentWaste.code.replace('*','')}.pdf`);
        } catch (err) {
            alert("Błąd generowania pliku.");
        } finally {
            btn.innerText = "POBIERZ ETYKIETĘ (A4 - PDF)";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
